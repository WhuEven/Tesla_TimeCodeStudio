name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一个分支连推多次时，只保留最新一次，省 runner 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 测试 · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 作者本机（Apple CLT）就是 3.9，必须保证仍能跑。
          # 注意 ubuntu-latest 已是 26.04，不再提供 3.9，固定用 24.04
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # PySide6 只带 Qt 库本身，Linux 上还需要这些系统库才能加载 offscreen 平台
      - name: 安装 Qt 运行库（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: 运行全部测试
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -t . -v

  # 构建脚本只在 macOS 上有意义，单独检查语法与打包前置条件
  build-script:
    name: 构建脚本检查
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 语法检查
        run: |
          bash -n build_app.sh
          bash -n release.sh

      - name: 脚本可执行位
        run: |
          test -x build_app.sh || { echo "build_app.sh 缺少可执行权限"; exit 1; }
          test -x release.sh || { echo "release.sh 缺少可执行权限"; exit 1; }
