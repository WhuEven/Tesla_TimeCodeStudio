name: Release

# 两种触发方式：
#   * 推送 v* 标签 —— 构建并附加到同名 Release（Release 不存在则自动创建）
#   * 手动运行 —— 只构建、把 zip 作为 workflow 产物，方便验证打包链路
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v，例如 1.0.1）"
        required: true
        default: "1.0.1"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: 构建 macOS 应用包
    # 分发包依赖 arm64 的 Python 与 ffmpeg，必须跑在 Apple Silicon runner 上
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 确认 runner 架构
        run: |
          echo "runner: $(uname -m)"
          test "$(uname -m)" = "arm64" || {
            echo "::error::当前 runner 不是 arm64，产物会与文件名不符"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 计算版本号
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TCS_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "TCS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # 发布前先跑测试：不绿不出包
      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: 构建自包含 .app 与 zip
        run: ./build_app.sh --dist

      - name: 记录校验值与内容清单
        run: |
          shasum -a 256 dist/*.zip | tee dist/SHA256SUMS.txt
          du -sh "dist/Time Code Studio.app" dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TimeCodeStudio-${{ env.TCS_VERSION }}-macOS-arm64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 30

      # 只有推标签才发布；手动运行仅产出 artifact
      - name: 创建或更新 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
              --title "TimeCode Studio $TCS_VERSION" --generate-notes
          fi
